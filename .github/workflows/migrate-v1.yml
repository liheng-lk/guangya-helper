name: Migrate Guangya Helper v1.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrate current Guangyadisk main
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/liheng-lk/Guangyadisk.git /tmp/src
          rsync -a --delete --exclude=.git --exclude=.github --exclude=README.md --exclude=LICENSE /tmp/src/ ./

          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('plugins.v2/shukguangyadisk')
          suffixes = {'.py','.js','.vue','.md','.json','.css','.yml','.yaml','.html'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in suffixes:
                  continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              s=s.replace('https://github.com/liheng-lk/Guangyadisk','https://github.com/liheng-lk/guangya-helper')
              s=s.replace('https://github.com/ShukeBta/Guangyadisk','https://github.com/liheng-lk/guangya-helper')
              s=s.replace('【Shuk-光鸭云盘】','【光鸭云盘助手】').replace('【光鸭云盘】','【光鸭云盘助手】').replace('【WebDAV】','【光鸭云盘助手】【WebDAV】')
              s=s.replace('Shuk-光鸭云盘客户端创建失败','光鸭云盘助手客户端创建失败')
              s=s.replace('plugin_name = "Shuk-光鸭云盘"','plugin_name = "光鸭云盘助手"')
              s=s.replace('_disk_name = "Shuk-光鸭云盘"','_disk_name = "光鸭云盘助手"')
              s=s.replace('plugin_author = "ShukeBta"','plugin_author = "liheng-lk"')
              p.write_text(s,encoding='utf-8')

          init=root/'__init__.py'
          s=init.read_text(encoding='utf-8')
          s=s.replace('from app.log import logger as _base_logger','from app.log import logger')
          for line in ['from . import _plugin_legacy as _plugin_legacy_module\n','from . import guangya_api as _guangya_api_module\n','from . import guangya_api_legacy as _guangya_api_legacy_module\n','from . import guangya_client as _guangya_client_module\n','from . import guangya_client_legacy as _guangya_client_legacy_module\n','from . import webdav_provider as _webdav_provider_module\n']:
              s=s.replace(line,'')
          s=re.sub(r'\nclass _UnifiedLogPrefixAdapter:.*?\n\nclass ShukGuangYaDisk\(_LegacyPlugin\):','\n\nclass ShukGuangYaDisk(_LegacyPlugin):',s,flags=re.S)
          s=re.sub(r'plugin_version\s*=\s*"[^"]+"','plugin_version = "1.0"',s,count=1)
          s=re.sub(r'author_url\s*=\s*"[^"]+"','author_url = "https://github.com/liheng-lk/guangya-helper"',s,count=1)
          s=re.sub(r'_legacy_disk_name\s*=\s*"[^"]+"','_legacy_disk_name = "Shuk-光鸭云盘"',s,count=1)
          init.write_text(s,encoding='utf-8')

          legacy=root/'_plugin_legacy.py'
          s=legacy.read_text(encoding='utf-8')
          s=s.replace('plugin_name = "Shuk-光鸭云盘"','plugin_name = "光鸭云盘助手"').replace('_disk_name = "Shuk-光鸭云盘"','_disk_name = "光鸭云盘助手"')
          s=re.sub(r'plugin_version\s*=\s*"[^"]+"','plugin_version = "1.0"',s,count=1)
          s=re.sub(r'plugin_author\s*=\s*"[^"]+"','plugin_author = "liheng-lk"',s,count=1)
          s=re.sub(r'author_url\s*=\s*"[^"]+"','author_url = "https://github.com/liheng-lk/guangya-helper"',s,count=1)
          legacy.write_text(s,encoding='utf-8')

          pj=root/'plugin.json'; d=json.loads(pj.read_text(encoding='utf-8'))
          d.update(name='光鸭云盘助手',version='1.0',author='liheng-lk',description='MoviePilot 光鸭云盘存储助手，支持扫码/短信登录、整理上传、上传进度监控、网络容错和 WebDAV。')
          d['history']={'v1.0':'独立项目首个正式版本：整合 MoviePilot V2、Vue UI、双登录、整理上传、进度监控、DNS/OSS 重试与 WebDAV。'}
          pj.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          pkg=root/'package.json'
          if pkg.exists():
              d=json.loads(pkg.read_text(encoding='utf-8')); d.update(name='moviepilot-guangya-helper',version='1.0.0',description='光鸭云盘助手 MoviePilot Vue 前端',author='liheng-lk'); d['repository']={'type':'git','url':'https://github.com/liheng-lk/guangya-helper.git'}; pkg.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for p in [Path('plugin.json'),Path('package.v2.json')]:
              if p.exists():
                  t=p.read_text(encoding='utf-8').replace('Shuk-光鸭云盘','光鸭云盘助手').replace('https://github.com/liheng-lk/Guangyadisk','https://github.com/liheng-lk/guangya-helper')
                  p.write_text(t,encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # 光鸭云盘助手

          **Guangya Helper** 是由 `liheng-lk` 维护的 MoviePilot V2 光鸭云盘存储插件。

          当前正式版本：**v1.0**  
          正式仓库：`https://github.com/liheng-lk/guangya-helper`

          ## 功能
          - 光鸭云盘 App 扫码授权登录 / 手机号短信登录
          - Token 自动刷新
          - 文件浏览、上传、下载、删除、重命名、新建目录
          - MoviePilot 外部存储与整理上传
          - 可开关的实时上传进度日志
          - DNS / OSS 临时故障自动重试
          - 上传完成目标文件可见性兜底确认
          - HTTP Range 流式代理与 WebDAV
          - Vue Federation Page / Config，适配 PC、平板、手机

          ## 安装
          MoviePilot 自定义插件源：
          ```text
          https://github.com/liheng-lk/guangya-helper
          ```

          ## 版本
          本独立项目从 **v1.0** 重新开始版本体系；v1.0 以迁移时 `Guangyadisk/main` 的最新稳定代码为功能基线。

          ## 致谢与参考
          - ShukeBta / Guangyadisk：早期存储实现与历史代码基础
          - KoWming / MoviePilot-Plugins：扫码授权流程参考
          - DDSRem-Dev / guangyaclient：认证、短信登录及接口行为参考
          - jxxghp / MoviePilot-Plugins：MoviePilot V2 与 Vue Federation 开发规范参考

          ## License
          MIT。原版权声明依许可证要求继续保留。
          EOF

          cat > LICENSE <<'EOF'
          MIT License

          Copyright (c) 2026 ShukeBta
          Copyright (c) 2026 liheng-lk (modifications, integration and continued maintenance)

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF

          cat > plugins.v2/shukguangyadisk/README.md <<'EOF'
          # 光鸭云盘助手 v1.0
          MoviePilot V2 光鸭云盘存储插件，由 `liheng-lk` 维护。

          仓库：`https://github.com/liheng-lk/guangya-helper`

          支持扫码/短信登录、目录浏览、整理上传、上传进度监控、DNS/OSS 网络容错、下载/移动/复制、HTTP Range 与 WebDAV。
          EOF

          python -m compileall -q plugins.v2/shukguangyadisk
          find plugins.v2/shukguangyadisk/dist/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check

          # Source-level log prefix check. The historical storage label is retained only for migration compatibility.
          ! grep -R --include='*.py' -n '【Shuk-光鸭云盘】\|【光鸭云盘】\|【WebDAV】' plugins.v2/shukguangyadisk

          rm -f .github/workflows/migrate-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate Guangya Helper v1.0 baseline'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
