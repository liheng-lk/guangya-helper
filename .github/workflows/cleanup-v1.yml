name: Cleanup Guangya Helper v1.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f _fix_name.py .migration-trigger .cleanup-trigger
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .DS_Store
          node_modules/
          .vite/
          EOF
          rm -f .github/workflows/cleanup-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean generated migration artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
